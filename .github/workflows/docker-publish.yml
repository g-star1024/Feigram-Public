name: Build Feigram Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 2.6.46），注入 Go 二进制；留空则为 dev"
        required: false
        default: ""
  push:
    tags:
      - "Feigram*"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/feigram

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute app version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # tag 形如 Feigram2.6.46 → 2.6.46
            echo "APP_VERSION=${GITHUB_REF_NAME#Feigram}" >> "$GITHUB_ENV"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "APP_VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=dev" >> "$GITHUB_ENV"
          fi

      # --- 自动构建 FPK 并发布 GitHub Release（仅推 Feigram* tag 时）---
      # 说明：FPK 构建依赖 Node 22 + 网络（prepare 脚本会自行 curl 下载 Go/Node 运行时），
      # 与 build-fpk.yml 前置一致，无需 setup-go。
      - name: Setup Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install client dependencies
        if: github.event_name == 'push'
        run: npm --prefix client ci

      - name: Build FPK package
        if: github.event_name == 'push'
        env:
          VERSION: ${{ env.APP_VERSION }}
        run: scripts/build-native-fpk.sh

      - name: Create GitHub Release with FPK asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Feigram ${{ env.APP_VERSION }}
          files: release/*.fpk
          generate_release_notes: true

      # --- Docker 镜像构建与推送（原有）---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=Feigram(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
